[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-assistant"
version = "0.1.0"
description = "Auditable Agent Swarm runtime for audit information queries"
requires-python = ">=3.10"

[project.scripts]
audit-assistant = "audit_assistant.__main__:main"

[tool.setuptools.package-data]
audit_assistant = ["web/*.html", "web/*.css", "web/*.js"]

[tool.setuptools.packages.find]
include = ["audit_assistant*"]

